<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// «كيفاش كيتبنا أكبر ملعب فإفريقيا؟» — 3D build of the Grand Stade Hassan II, timed to the user's Darija voiceover.
import * as THREE from 'three';
import {RoomEnvironment} from './RoomEnvironment.js';
const W=1080,H=1920,out=document.getElementById('c'),ctx=out.getContext('2d');
const C=[[0.17,2.402],[2.742,4.494],[4.834,5.88],[6.131,9.788],[10.128,14.617],[14.957,15.962],[16.302,17.272],[17.612,18.759],[19.099,20.602],[20.942,25.193],[25.533,25.849],[26.166,27.78],[28.058,29.656],[29.961,31.894],[32.234,35.167],[35.507,35.926],[36.266,38.351],[38.691,43.191],[43.531,44.661],[45.211,45.847],[46.187,46.636],[46.91,48.851],[49.191,49.995],[50.335,51.246]];
const T=i=>C[i][0],DURATION=52.5;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t,prog=(t,a,b)=>clamp((t-a)/(b-a));
const eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,eout=t=>1-Math.pow(1-t,3);
const eback=t=>{if(t<=0)return 0;const c1=1.6,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const RED='#d8322a',GREEN='#1f9d55',MRED='#c1272d',MGREEN='#006233';

// ---------- renderer ----------
const glc=document.createElement('canvas');glc.width=W;glc.height=H;
const R=new THREE.WebGLRenderer({canvas:glc,antialias:true,preserveDrawingBuffer:true});
R.setSize(W,H,false);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();const DAY=new THREE.Color('#c9a77c'),NIGHT=new THREE.Color('#0d1330');scene.background=DAY.clone();scene.fog=new THREE.Fog(DAY.clone(),70,170);
const pm=new THREE.PMREMGenerator(R);scene.environment=pm.fromScene(new RoomEnvironment(),.04).texture;
const cam=new THREE.PerspectiveCamera(46,W/H,.5,400);
const hemi=new THREE.HemisphereLight('#fff1dc','#8a6a48',.6);scene.add(hemi);
const sun=new THREE.DirectionalLight('#fff4e0',2.3);sun.position.set(25,45,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.radius=6;sun.shadow.bias=-.0005;
Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,near:5,far:120});scene.add(sun);
const spot=new THREE.SpotLight('#fff3d6',0,0,.9,.6,0);spot.position.set(0,30,0);spot.target.position.set(0,0,0);scene.add(spot,spot.target);
const STD=(c,r=.6,m=.05,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,...o});
const cvTex=(w,h,f,srgb=true)=>{const cv=document.createElement('canvas');cv.width=w;cv.height=h;f(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);if(srgb)t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;};
const sandTex=cvTex(512,512,(g,w,h)=>{g.fillStyle='#c4a073';g.fillRect(0,0,w,h);for(let i=0;i<9000;i++){g.fillStyle=Math.random()<.5?'rgba(120,90,55,.10)':'rgba(255,240,210,.10)';g.fillRect(Math.random()*w,Math.random()*h,2,2);}});
sandTex.wrapS=sandTex.wrapT=THREE.RepeatWrapping;sandTex.repeat.set(30,30);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),STD('#ffffff',1,0,{map:sandTex}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const disc=(a,b,y,mat)=>{const m=new THREE.Mesh(new THREE.CircleGeometry(1,96),mat);m.rotation.x=-Math.PI/2;m.scale.set(a,b,1);m.position.y=y;m.receiveShadow=true;scene.add(m);return m;};
const lawn=disc(34,31,.02,STD('#6f9a4f',1,0,{transparent:true,opacity:0}));
const dirt=disc(17.5,15.5,.03,STD('#9a7a55',1,0,{transparent:true,opacity:0}));

// ---------- stadium geometry ----------
function ringGeo(a0,b0,y0,a1,b1,y1,seg=160,uRep=24){const pos=[],uv=[],idx=[];for(let i=0;i<=seg;i++){const th=i/seg*Math.PI*2,c=Math.cos(th),s=Math.sin(th);
  pos.push(a0*c,y0,b0*s,a1*c,y1,b1*s);uv.push(i/seg*uRep,0,i/seg*uRep,1);if(i<seg){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g;}
const rowsTex=cvTex(64,256,(g,w,h)=>{g.fillStyle='#b9b3a8';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=16){g.fillStyle='#8f897f';g.fillRect(0,y,w,5);}});
rowsTex.wrapS=rowsTex.wrapT=THREE.RepeatWrapping;
const concrete=STD('#ffffff',.85,0,{map:rowsTex,side:THREE.DoubleSide});const wallMat=STD('#d9cdb8',.9,0,{side:THREE.DoubleSide});
const TIERS=[[7.6,5.6,.3,10.5,8.5,2.8,5,260],[10.8,8.8,3.4,13.2,11.2,6.4,6,300],[13.5,11.5,7.0,15.6,13.6,10.0,6,330]];
const tierGroups=[];
TIERS.forEach(([a0,b0,y0,a1,b1,y1])=>{const g=new THREE.Group();const m=new THREE.Mesh(ringGeo(a0,b0,y0,a1,b1,y1),concrete);m.castShadow=m.receiveShadow=true;g.add(m);
  const wall=new THREE.Mesh(ringGeo(a1,b1,y1,a1,b1,y1+.6),wallMat);wall.castShadow=true;g.add(wall);
  const front=new THREE.Mesh(ringGeo(a0,b0,0,a0,b0,y0),wallMat);g.add(front);scene.add(g);tierGroups.push(g);});
// facade with vertical fins
const facade=new THREE.Group();const fac=new THREE.Mesh(ringGeo(16.0,14.0,0,16.0,14.0,10.6),STD('#e4dccb',.8,0,{side:THREE.DoubleSide}));fac.castShadow=fac.receiveShadow=true;facade.add(fac);
const finGeo=new THREE.BoxGeometry(.25,10.8,.7),finMat=STD('#f2ece0',.6,.1);const fins=new THREE.InstancedMesh(finGeo,finMat,96);const dm=new THREE.Object3D();
for(let i=0;i<96;i++){const th=i/96*Math.PI*2;dm.position.set(16.3*Math.cos(th),5.4,14.3*Math.sin(th));dm.rotation.set(0,-th,0);dm.updateMatrix();fins.setMatrixAt(i,dm.matrix);}fins.castShadow=true;facade.add(fins);scene.add(facade);
// foundation pillars
const NP=72;const pillars=new THREE.InstancedMesh(new THREE.CylinderGeometry(.35,.35,1,12),STD('#a8a196',.8,.05),NP*2);pillars.castShadow=true;scene.add(pillars);
const pillarPos=[];for(let r=0;r<2;r++)for(let i=0;i<NP;i++){const th=i/NP*Math.PI*2;const a=r?16.0:11.0,b=r?14.0:9.0;pillarPos.push([a*Math.cos(th),b*Math.sin(th),th,r]);}
// seats (instanced, sorted by angle so .count sweeps around)
const seatMeshes=[];const seatGeo=new THREE.BoxGeometry(.26,.16,.22);
TIERS.forEach(([a0,b0,y0,a1,b1,y1,rows,per],ti)=>{const n=rows*per;const im=new THREE.InstancedMesh(seatGeo,STD('#ffffff',.5,.05),n);const col=new THREE.Color();let k=0;
  for(let i=0;i<per;i++){const th=i/per*Math.PI*2;for(let r=0;r<rows;r++){const f=(r+.5)/rows;const a=lerp(a0,a1,f),b=lerp(b0,b1,f),y=lerp(y0,y1,f)+.12;
    dm.position.set(a*Math.cos(th),y,b*Math.sin(th));dm.rotation.set(0,Math.atan2(-Math.cos(th)*a,-Math.sin(th)*b),0);dm.updateMatrix();im.setMatrixAt(k,dm.matrix);
    const sector=Math.floor((th/(Math.PI*2))*12+ti*.5)%2;const stripe=(r===rows-1&&i%9<2);col.set(stripe?'#f4f1ea':(sector?MRED:MGREEN));im.setColorAt(k,col);k++;}}
  im.count=0;im.castShadow=true;scene.add(im);seatMeshes.push(im);});
// pitch
const pitchTex=cvTex(1050,680,(g,w,h)=>{for(let i=0;i<14;i++){g.fillStyle=i%2?'#3f8f3a':'#4aa043';g.fillRect(i*w/14,0,w/14+1,h);}g.strokeStyle='#ffffff';g.lineWidth=6;
  g.strokeRect(20,20,w-40,h-40);g.beginPath();g.moveTo(w/2,20);g.lineTo(w/2,h-20);g.stroke();g.beginPath();g.arc(w/2,h/2,92,0,7);g.stroke();
  for(const s of [0,1]){const x=s?w-20:20,d=s?-1:1;g.strokeRect(Math.min(x,x+d*165),h/2-202,165,404);g.strokeRect(Math.min(x,x+d*55),h/2-92,55,184);g.beginPath();g.arc(x+d*110,h/2,5,0,7);g.fillStyle='#fff';g.fill();}});
const runoff=new THREE.Mesh(new THREE.PlaneGeometry(12.6,8.8),STD('#3b7d36',1,0));runoff.rotation.x=-Math.PI/2;runoff.position.y=.06;runoff.receiveShadow=true;scene.add(runoff);
const pitch=new THREE.Mesh(new THREE.PlaneGeometry(10.5,6.8),STD('#ffffff',.9,0,{map:pitchTex}));pitch.rotation.x=-Math.PI/2;pitch.position.y=.08;pitch.receiveShadow=true;scene.add(pitch);
// roof: tent-like aluminium lattice
function roofGeo(){const segA=200,segR=10,pos=[],uv=[],idx=[];for(let j=0;j<=segR;j++){const r=j/segR;for(let i=0;i<=segA;i++){const th=i/segA*Math.PI*2;
  const a=lerp(9.6,17.6,r),b=lerp(7.6,15.6,r);const y=lerp(13.6,11.0,r)+1.3*Math.sin(12*th)*Math.sin(Math.PI*r)+.6*Math.sin(Math.PI*r);
  pos.push(a*Math.cos(th),y,b*Math.sin(th));uv.push(i/segA*28,r*4);}}
  for(let j=0;j<segR;j++)for(let i=0;i<segA;i++){const a=j*(segA+1)+i,b=a+segA+1;idx.push(a,b,a+1,b,b+1,a+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g;}
const latTex=cvTex(256,256,(g,w,h)=>{g.fillStyle='#000';g.fillRect(0,0,w,h);g.strokeStyle='#fff';g.lineWidth=22;g.beginPath();g.moveTo(0,0);g.lineTo(w,h);g.moveTo(w,0);g.lineTo(0,h);g.stroke();g.lineWidth=14;g.strokeRect(0,0,w,h);},false);
latTex.wrapS=latTex.wrapT=THREE.RepeatWrapping;
const roof=new THREE.Group();const rg=roofGeo();
const lattice=new THREE.Mesh(rg,STD('#ecebe6',.3,.8,{alphaMap:latTex,alphaTest:.4,side:THREE.DoubleSide}));lattice.castShadow=true;roof.add(lattice);
const membrane=new THREE.Mesh(rg,STD('#f6f3ea',.5,.1,{transparent:true,opacity:.22,side:THREE.DoubleSide,depthWrite:false}));roof.add(membrane);
const ringCurve=new THREE.CatmullRomCurve3([...Array(64)].map((_,i)=>{const th=i/64*Math.PI*2;return new THREE.Vector3(9.6*Math.cos(th),13.4,7.6*Math.sin(th));}),true);
const lightMat=STD('#fff6d0',.3,0,{emissive:'#fff2c4',emissiveIntensity:0});const lightRing=new THREE.Mesh(new THREE.TubeGeometry(ringCurve,200,.16,8,true),lightMat);roof.add(lightRing);
scene.add(roof);
// moussem tent
const tentTex=cvTex(512,128,(g,w,h)=>{for(let i=0;i<16;i++){g.fillStyle=i%2?'#f1e6d0':'#b8322b';g.fillRect(i*w/16,0,w/16+1,h);}});
const tent=new THREE.Group();const cone=new THREE.Mesh(new THREE.ConeGeometry(4.2,3.6,10,1,true),STD('#ffffff',.9,0,{map:tentTex,side:THREE.DoubleSide,transparent:true}));cone.position.y=4.2;cone.castShadow=true;tent.add(cone);
const wallT=new THREE.Mesh(new THREE.CylinderGeometry(4.2,4.2,2.4,10,1,true),STD('#ffffff',.9,0,{map:tentTex,side:THREE.DoubleSide,transparent:true}));wallT.position.y=1.2;wallT.castShadow=true;tent.add(wallT);
const pole=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,6.6,8),STD('#5a3d2b'));pole.position.y=3.3;tent.add(pole);tent.visible=false;scene.add(tent);
// trees
const NT=150;const foliage=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,1),STD('#3e7a3a',.9,0),NT),trunks=new THREE.InstancedMesh(new THREE.CylinderGeometry(.14,.18,1.4,6),STD('#5a3d2b'),NT);
foliage.castShadow=trunks.castShadow=true;scene.add(foliage,trunks);const treePos=[];
for(let i=0;i<NT;i++){const th=Math.random()*Math.PI*2,r=1.25+Math.random()*.85;treePos.push([17.5*r*Math.cos(th),15.5*r*Math.sin(th),.8+Math.random()*.7,Math.random()]);}
// banners
function bannerTex(bg,fg,txt,star){return cvTex(512,220,(g,w,h)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle=fg;g.fillRect(0,0,w,18);g.fillRect(0,h-18,w,18);
  if(star){g.strokeStyle=MGREEN;g.lineWidth=10;g.beginPath();for(let k=0;k<6;k++){const a=-Math.PI/2+k*4*Math.PI/5;const x=w*.82+46*Math.cos(a),y=h/2+46*Math.sin(a);k?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();}
  g.direction='rtl';g.fillStyle=fg;g.font='900 96px Cairo';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,star?w*.4:w/2,h/2+8);});}
const banners=[];[['#0b7a3e','#ffffff','الرجاء',0,-3.4],['#c8102e','#ffffff','الوداد',0,3.4],[MRED,'#ffffff','المنتخب',1,0]].forEach(([bg,fg,txt,star,x],i)=>{
  const geo=new THREE.PlaneGeometry(3.1,1.35,24,6);const m=new THREE.Mesh(geo,STD('#ffffff',.8,0,{map:bannerTex(bg,fg,txt,star),side:THREE.DoubleSide}));
  const z=-8.75*Math.sqrt(1-(x/10.8)**2)+.15;m.position.set(x,4.05,z);m.rotation.y=Math.atan2(-x,-z);m.userData.base=geo.attributes.position.array.slice();m.visible=false;scene.add(m);banners.push(m);});

// ---------- timeline ----------
const HOOK_END=4.75;
const BUILD={pillars:T(4),dirt:T(4),t0:T(5)+.15,t1:T(6),t2:T(6)+.7,facade:T(7),seats:T(8),tent:T(12),roof:T(13),pitch:T(14),lights:T(14)+1.1,trees:T(14)+2.0};
function amt(name,t,dur=.9){if(t<HOOK_END){const order={roof:0,lights:0,trees:.1,facade:.25,t2:.35,t1:.45,t0:.55,seats:.2,pitch:.3,pillars:.6,dirt:.7}[name]??0;return 1-eio(prog(t,T(1)+order,T(1)+order+.8));}
  return prog(t,BUILD[name],BUILD[name]+dur);}
function night(t){return eio(prog(t,T(20)-.2,T(20)+.8));}
// camera keys [t, pos, target]
const K=[[0,[0,62,58],[0,4,0]],[2.4,[8,44,40],[0,4,0]],[4.6,[26,46,38],[0,2,0]],[9.9,[30,48,36],[0,2,0]],
  [10.6,[22,20,32],[0,1,0]],[14.6,[28,22,26],[0,2,0]],[17.2,[-10,30,40],[0,4,0]],[19.0,[-26,28,32],[0,4,0]],
  [20.6,[-14,22,26],[0,4,-2]],[25.2,[12,22,26],[0,4,-2]],[27.9,[22,30,34],[0,7,0]],[31.9,[32,44,46],[0,7,0]],
  [32.6,[0,62,46],[0,0,0]],[35.2,[28,54,48],[0,2,0]],[38.4,[-30,52,50],[0,3,0]],
  [39.4,[0,17,3.5],[0,2.6,-8]],[43.2,[.8,17.5,4.0],[0,2.6,-8]],[44.2,[0,70,62],[0,4,0]],[46.3,[28,52,56],[0,5,0]],[52.5,[-38,46,54],[0,5,0]]];
function camAt(t){let i=0;while(i<K.length-2&&t>K[i+1][0])i++;const [t0,p0,q0]=K[i],[t1,p1,q1]=K[i+1];const k=eio(prog(t,t0,t1));
  cam.position.set(lerp(p0[0],p1[0],k),lerp(p0[1],p1[1],k),lerp(p0[2],p1[2],k));cam.lookAt(lerp(q0[0],q1[0],k),lerp(q0[1],q1[1],k),lerp(q0[2],q1[2],k));}
const v3=new THREE.Vector3();const P=(x,y,z)=>{v3.set(x,y,z).project(cam);return [(v3.x+1)/2*W,(1-v3.y)/2*H];};

// ---------- 2D overlays ----------
function chip(text,x,y,size,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha=a;ctx.direction='rtl';ctx.font=`900 ${size}px Cairo`;ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(text).width+size*1.1,h=size*1.7;ctx.fillStyle='#fffaf0';ctx.strokeStyle='#3a2a1a';ctx.lineWidth=size*.09;ctx.shadowColor='rgba(60,30,10,.35)';ctx.shadowOffsetY=size*.12;
  ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,size*.35);ctx.fill();ctx.shadowColor='transparent';ctx.stroke();ctx.fillStyle='#1a1a1a';ctx.fillText(text,x,y+size*.08);ctx.restore();}
function label(t,t0,t1,txt,xy,col,dx=0,dy=-90){const a=eback(prog(t,t0,t0+.3))*(t1?1-prog(t,t1,t1+.25):1);if(a<=0)return;const [x,y]=xy;
  ctx.save();ctx.strokeStyle=col;ctx.lineWidth=3;ctx.setLineDash([6,6]);ctx.globalAlpha=clamp(a);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx,y+dy+24);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,7,0,7);ctx.fill();ctx.translate(x+dx,y+dy);ctx.scale(a,a);ctx.direction='rtl';ctx.font='800 38px Cairo';const w=ctx.measureText(txt).width+40;
  ctx.fillStyle='#fffaf0';ctx.beginPath();ctx.roundRect(-w/2,-29,w,58,12);ctx.fill();ctx.lineWidth=3.5;ctx.stroke();ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,0,3);ctx.restore();}
const CAPS=[[0,'*115 ألف مغربي|فبلاصة وحدة…'],[T(1),'أجي نبنيو الملعب|اللي غادي *يجمعهم'],[T(2),'ماشي *فسيدي *سليمان…'],[T(3),'كيتبنا *فالمنصورية|إقليم *بنسليمان، حدا كازا'],
  [T(4),'نبداو *بالأساس'],[T(4)+1.7,'البيطون والحديد|تحت الأرض'],[T(5),'من بعد *المدرجات'],[T(6),'طبقة فوق طبقة'],[T(7),'كيدورو *بالتيران'],
  [T(8),'*115 *ألف كرسي'],[T(9),'إلا جلس واحد|كل ثانية'],[T(9)+2.2,'خصنا أكثر من|*31 *ساعة'],[T(10),'ودابا أهم حاجة'],[T(11)+.8,'*السقف'],
  [T(12),'مستوحى من *الخيام|ديال *الموسم'],[T(13),'شبكة كبيرة ديال|*الألومنيوم'],[T(14),'*التيران، *والضو|والجنان'],[T(15),'*التكلفة؟'],[T(16),'*5.1 *مليار درهم'],
  [T(17),'من *2029 غادي يكون|الدار ديال'],[T(17)+2.2,'*الرجاء، *الوداد|*والمنتخب'],[T(18),'وفـ*2030…'],[T(19),'*كاس *العالم'],[T(20),'*مبروك…'],[T(21),'بنيتي أكبر ملعب|*فإفريقيا'],
  [T(22),'شنو نبنيو *من *بعد؟'],[T(23),'كتبها ليا|*فالكومنتير']];
function captions(t){let i=-1;CAPS.forEach((c,k)=>{if(t>=c[0])i=k;});if(i<0)return;const [t0,txt]=CAPS[i];const lines=txt.split('|');
  ctx.save();ctx.direction='rtl';ctx.textBaseline='middle';const fs=80;ctx.font=`900 ${fs}px Cairo`;let n=0;
  lines.forEach((ln,li)=>{const words=ln.split(' ').map(w=>w.startsWith('*')?[w.slice(1),1]:[w,0]);const ws=words.map(w=>ctx.measureText(w[0]).width),sp=20;const tot=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
    let x=(W+tot)/2;const y=1440+li*104;words.forEach(([w,red],k)=>{const p=t0===0?1:eout(prog(t,t0+n*.05,t0+n*.05+.22));n++;ctx.globalAlpha=p;ctx.textAlign='right';const yy=y+(1-p)*18;

// regional map card (Rabat–Casablanca area only)

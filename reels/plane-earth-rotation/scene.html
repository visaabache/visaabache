// plane model
const plane=new THREE.Group();{const wm=new THREE.MeshStandardMaterial({color:'#f4f6fa',roughness:.35,metalness:.2}),rm=new THREE.MeshStandardMaterial({color:'#c1272d',roughness:.4});

function orientGlobe(lat,lon,spin=0){ // rotate globe so (lat,lon) faces camera (+z), then extra spin about world Y
  const q1=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),-(lon+PI/2)); // bring lon to +z
  const q2=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),lat);

  [T(27),'صيفطها لصاحبك|اللي ما عارفش هادشي'],[T(28),'وكتب ليا شنو|*نشرحو من بعد']];
function captions(t){let i=-1;CAPS.forEach((c,k)=>{if(t>=c[0])i=k;});if(i<0)return;const [t0,txt]=CAPS[i];const lines=txt.split('|');
  ctx.save();ctx.direction='rtl';ctx.textBaseline='middle';ctx.font='900 74px Cairo';let n=0;
  lines.forEach((ln,li)=>{const words=ln.split(' ').map(w=>w.startsWith('*')?[w.slice(1),1]:[w,0]);const ws=words.map(w=>ctx.measureText(w[0]).width),sp=18;const tot=ws.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
    let x=(W+tot)/2;const y=1440+li*96;words.forEach(([w,hl],k)=>{const p=t0===0?1:eout(prog(t,t0+n*.05,t0+n*.05+.22));n++;ctx.globalAlpha=p;ctx.textAlign='right';const yy=y+(1-p)*16;
      ctx.lineJoin='round';ctx.strokeStyle='rgba(5,10,20,.88)';ctx.lineWidth=15;ctx.strokeText(w,x,yy);ctx.fillStyle=hl?GOLD:'#ffffff';ctx.fillText(w,x,yy);x-=ws[k]+sp;});});ctx.restore();}

  ctx.save();for(let i=0;i<120;i++){const x=(Math.sin(i*12.9898)*43758.5453%1+1)%1*W,y=(Math.sin(i*78.233)*12345.678%1+1)%1*H;ctx.globalAlpha=.25+.4*((i*7)%10)/10;ctx.fillStyle='#cfe0ff';ctx.fillRect(x,y,2.2,2.2);}ctx.restore();}

// ---------- scenes ----------

  return true;
}

  if(t>T(14)){const up=eout(prog(t,T(14)+.3,T(16)+.4));const pos=worldOf(CASA_LL[0],CASA_LL[1],1.0+.09*up);plane.position.copy(pos);plane.up.copy(pos.clone().normalize());
    const ahead=worldOf(CASA_LL[0],CASA_LL[1]+.1,1.0+.09*up);plane.lookAt(ahead);plane.scale.setScalar(.75*eback(prog(t,T(14),T(14)+.4)));plane.visible=true;}

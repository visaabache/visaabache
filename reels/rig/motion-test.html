<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="rig.js"></script><script>
const W=1080,H=1920,c=document.getElementById('c'),ctx=c.getContext('2d');const {draw,walkPath,clamp,lerp,sstep,CREAM}=RIG;
const GROUND=1500,DURATION=8;
const bg=(()=>{const o=document.createElement('canvas');o.width=W;o.height=H;const g=o.getContext('2d');
  let gr=g.createLinearGradient(0,0,0,GROUND);gr.addColorStop(0,'#17142a');gr.addColorStop(.5,'#3c2b4a');gr.addColorStop(.85,'#8a5a6b');gr.addColorStop(1,'#c88b7a');g.fillStyle=gr;g.fillRect(0,0,W,GROUND);
  const rg=g.createRadialGradient(780,1150,0,780,1150,560);rg.addColorStop(0,'rgba(255,220,180,.85)');rg.addColorStop(.15,'rgba(255,196,160,.4)');rg.addColorStop(1,'rgba(255,170,140,0)');g.fillStyle=rg;g.fillRect(0,0,W,GROUND);
  let s=5;const r=()=>{s=(s*16807)%2147483647;return (s-1)/2147483646};
  for(let x=-20;x<W;){const w=70+r()*120,h=260+r()*520;g.fillStyle='#3a2f3d';g.fillRect(x,GROUND-h,w,h);g.fillStyle='rgba(243,225,162,.45)';for(let i=0;i<12;i++)g.fillRect(x+8+r()*(w-16),GROUND-h+12+r()*(h-30),7,9);x+=w+6+r()*14;}
  gr=g.createLinearGradient(0,GROUND,0,H);gr.addColorStop(0,'#3f3639');gr.addColorStop(1,'#151214');g.fillStyle=gr;g.fillRect(0,GROUND,W,H-GROUND);g.fillStyle='#5d5052';g.fillRect(0,GROUND,W,5);
  // bench
  g.fillStyle='#24191b';g.fillRect(520,1408,12,92);g.fillRect(790,1408,12,92);g.fillStyle='#6b4a3a';g.fillRect(490,1396,340,16);g.fillStyle='#5a3d30';g.fillRect(500,1300,320,14);g.fillRect(515,1314,8,82);g.fillRect(797,1314,8,82);
  return o;})();
const grains=[...Array(6)].map(()=>{const o=document.createElement('canvas');o.width=540;o.height=960;const g=o.getContext('2d');const id=g.createImageData(540,960);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=18;}g.putImageData(id,0,0);return o;});
function forehead(txt,col,pulse){return P=>{const s=P.s,fs=P.HR*.5;ctx.save();ctx.font=`900 ${fs}px Inter`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=18+8*(pulse||0);ctx.fillText(txt,P.hdx+P.d*4*s,P.hdy-P.HR*.5);ctx.restore();};}
window.render=function(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);
  // old man: walks with cane to bench, then sits
  const om=walkPath(t,0,4.6,72,.6);const ox=980-om.dist;const sit=clamp((t-4.8)/1.2);
  const ocx=ox-58*1.05;
  draw(ctx,{x:ox,y:GROUND,s:1.05,dir:-1,kind:'old',t,dist:om.dist,walk:om.walk,sit,seat:[ox-4,1398],col:'#6b8fb8',hair:'side',hairCol:'#cfc8c0',glasses:true,face:'calm'==='x'?'calm':'smile',seed:3,
    hands:sit<.05?{front:[ocx+Math.sin(om.dist/150*Math.PI*2)*4,GROUND-168]}:{front:[lerp(ocx,ox-88,sit),lerp(GROUND-168,1380,sit)]},
    prop:P=>{ctx.save();ctx.strokeStyle='#8a5a3a';ctx.lineWidth=7;ctx.lineCap='round';const h=P.arms[0].hd;ctx.beginPath();ctx.moveTo(h[0],h[1]);ctx.lineTo(h[0]-6+sit*-40,GROUND-2-sit*4);ctx.stroke();ctx.restore();},
    onHead:forehead('2H',  '#ff6b6b',Math.sin(t*6))});
  // adult: walks in, stops, idles
  const am=walkPath(t,.2,3.4,215,.5);
  draw(ctx,{x:-260+am.dist,y:GROUND,s:1.1,dir:1,kind:'adult',t,dist:am.dist,walk:am.walk,col:'#5f9e6e',seed:5,onHead:forehead('34Y','#f4d6a6')});
  // kid: walks through looking at phone
  const km=walkPath(t,1.2,8,150,.4);const kx=-140+km.dist;
  draw(ctx,{x:kx,y:GROUND,s:.74,dir:1,kind:'kid',t,dist:km.dist,walk:km.walk,col:'#8b6fd6',look:1,seed:9,face:'o',
    hands:{front:[kx+40,GROUND-250*.74],back:[kx+30,GROUND-246*.74]},
    inHand:P=>{const h=P.arms[0].hd;ctx.save();ctx.fillStyle='#0b0a10';ctx.strokeStyle='#cfd6ff';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(h[0]-6,h[1]-34,22,38,4);ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(170,200,255,.9)';ctx.shadowColor='#aac8ff';ctx.shadowBlur=24;ctx.fillRect(h[0]-3,h[1]-30,16,30);ctx.restore();},
    onHead:forehead('70Y','#6ee79a')});
  const vg=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  ctx.drawImage(grains[Math.floor(t*24)%6],0,0,W,H);
};
window.DURATION=DURATION;
</script></body></html>
